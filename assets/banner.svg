<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1baf7a"/>
      <stop offset="100%" stop-color="#eda100"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <g stroke="#3a5a68" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- right-side motif: PM2.5 forecast line rising through drifting pollution particles -->
  <g filter="url(#glow)">
    <!-- drifting particles (pop-in + pulse) -->
    <g fill="#7fa9bd">
      <circle cx="840" cy="120" r="0" opacity="0.8">
        <animate attributeName="r" values="0;6" begin="0.3s" dur="0.5s" fill="freeze"/>
        <animate attributeName="opacity" values="0.8;0.35;0.8" begin="0.8s" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="905" cy="90" r="0" opacity="0.7">
        <animate attributeName="r" values="0;9" begin="0.45s" dur="0.5s" fill="freeze"/>
        <animate attributeName="opacity" values="0.7;0.3;0.7" begin="1s" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="140" r="0" opacity="0.75">
        <animate attributeName="r" values="0;7" begin="0.6s" dur="0.5s" fill="freeze"/>
        <animate attributeName="opacity" values="0.75;0.3;0.75" begin="1.2s" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1055" cy="100" r="0" opacity="0.7">
        <animate attributeName="r" values="0;10" begin="0.75s" dur="0.5s" fill="freeze"/>
        <animate attributeName="opacity" values="0.7;0.28;0.7" begin="1.4s" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="130" r="0" opacity="0.7">
        <animate attributeName="r" values="0;6" begin="0.9s" dur="0.5s" fill="freeze"/>
        <animate attributeName="opacity" values="0.7;0.3;0.7" begin="1.6s" dur="2.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="870" cy="180" r="0" opacity="0.6">
        <animate attributeName="r" values="0;5" begin="1s" dur="0.5s" fill="freeze"/>
        <animate attributeName="opacity" values="0.6;0.25;0.6" begin="1.8s" dur="3.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- forecast trend line drawing in -->
    <polyline points="820,230 870,210 920,215 970,180 1020,190 1070,150 1130,165"
      fill="none" stroke="#1baf7a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="420" stroke-dashoffset="420">
      <animate attributeName="stroke-dashoffset" from="420" to="0" begin="1.1s" dur="1.3s" fill="freeze"/>
    </polyline>
    <!-- winter-peak marker (pop) -->
    <circle cx="1070" cy="150" r="0" fill="#eda100">
      <animate attributeName="r" values="0;7;5" begin="2.3s" dur="0.6s" fill="freeze"/>
    </circle>
  </g>

  <rect x="70" y="96" width="8" height="128" rx="4" fill="url(#accent)"/>
  <text x="105" y="128" font-size="44" font-weight="700" fill="#ffffff">Forecasting Urban Air Quality</text>
  <text x="105" y="172" font-size="23" font-weight="400" fill="#bfe9d8">Predicting PM2.5 Pollution Across Canadian Cities</text>

  <g font-size="16" font-weight="600">
    <rect x="105" y="200" width="150" height="34" rx="17" fill="#1baf7a" opacity="0.9"/>
    <text x="180" y="223" fill="#0b0b0b" text-anchor="middle">6 Models Tested</text>
    <rect x="267" y="200" width="160" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
    <text x="347" y="223" fill="#cfeefc" text-anchor="middle">2020–2023 NAPS</text>
    <rect x="439" y="200" width="150" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
    <text x="514" y="223" fill="#cfeefc" text-anchor="middle">R² ≈ 0.55</text>
  </g>

  <text x="105" y="285" font-size="15" fill="#7fa9bd">Python · scikit-learn · SARIMAX · Power BI   |   Heta Chavda — Data Analytics Portfolio</text>

  <rect x="-260" y="0" width="260" height="320" fill="url(#shine)" transform="skewX(-20)">
    <animate attributeName="x" from="-260" to="1300" dur="4.5s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
