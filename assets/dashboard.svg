<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#184f95"/>
      <stop offset="100%" stop-color="#1baf7a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" fill="#f9f9f7"/>

  <!-- header -->
  <rect x="0" y="0" width="1200" height="86" fill="url(#head)"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#ffffff">PM2.5 Air Quality Forecasting Dashboard</text>
  <text x="30" y="70" font-size="15" fill="#d6f5e8">NAPS 2020–2023 · Canadian cities · 6 models compared</text>

  <!-- KPI tiles -->
  <rect x="30" y="110" width="360" height="110" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <rect x="30" y="110" width="6" height="110" rx="3" fill="#2a78d6"/>
  <text x="58" y="148" font-size="14" font-weight="600" fill="#898781" letter-spacing="1">BEST MODEL RMSE</text>
  <text x="56" y="198" font-size="46" font-weight="700" fill="#0b0b0b">~13.5</text>

  <rect x="420" y="110" width="360" height="110" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <rect x="420" y="110" width="6" height="110" rx="3" fill="#1baf7a"/>
  <text x="448" y="148" font-size="14" font-weight="600" fill="#898781" letter-spacing="1">BEST MODEL R²</text>
  <text x="446" y="198" font-size="46" font-weight="700" fill="#0b0b0b">~0.55</text>

  <rect x="810" y="110" width="360" height="110" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <rect x="810" y="110" width="6" height="110" rx="3" fill="#eda100"/>
  <text x="838" y="148" font-size="14" font-weight="600" fill="#898781" letter-spacing="1">MODELS TESTED</text>
  <text x="836" y="198" font-size="46" font-weight="700" fill="#0b0b0b">6</text>

  <!-- Seasonal PM2.5 trend (line) -->
  <rect x="30" y="250" width="740" height="300" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <circle cx="48" cy="282" r="5" fill="#2a78d6"/>
  <text x="62" y="287" font-size="16" font-weight="700" fill="#0b0b0b">Seasonal PM2.5 Pattern — Winter Peaks</text>

  <!-- axes -->
  <line x1="80" y1="490" x2="740" y2="490" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="80" y1="490" x2="80" y2="320" stroke="#c3c2b7" stroke-width="1.5"/>
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="80" y1="440" x2="740" y2="440"/>
    <line x1="80" y1="390" x2="740" y2="390"/>
    <line x1="80" y1="340" x2="740" y2="340"/>
  </g>

  <!-- PM2.5 curve: high winter (Jan/Dec), low summer -->
  <polyline points="120,352 190,378 260,420 330,452 400,470 470,455 540,415 610,372 680,345"
    fill="none" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#184f95">
    <circle cx="120" cy="352" r="4"/><circle cx="190" cy="378" r="4"/><circle cx="260" cy="420" r="4"/>
    <circle cx="330" cy="452" r="4"/><circle cx="400" cy="470" r="4"/><circle cx="470" cy="455" r="4"/>
    <circle cx="540" cy="415" r="4"/><circle cx="610" cy="372" r="4"/><circle cx="680" cy="345" r="4"/>
  </g>
  <!-- month labels -->
  <g font-size="11.5" fill="#52514e" text-anchor="middle">
    <text x="120" y="510">Jan</text><text x="190" y="510">Mar</text><text x="260" y="510">May</text>
    <text x="330" y="510">Jul</text><text x="400" y="510">Aug</text><text x="470" y="510">Sep</text>
    <text x="540" y="510">Oct</text><text x="610" y="510">Nov</text><text x="680" y="510">Dec</text>
  </g>
  <text x="118" y="338" font-size="11" font-weight="700" fill="#184f95" text-anchor="middle">HIGH</text>
  <text x="400" y="337" font-size="11" fill="#898781" text-anchor="middle">summer trough</text>
  <text x="405" y="535" font-size="11" fill="#898781" text-anchor="middle">Relative PM2.5 concentration by month — illustrative of observed winter-peak seasonality</text>

  <!-- Pollutant correlation with PM2.5 (horizontal bars) -->
  <rect x="795" y="250" width="375" height="300" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <circle cx="813" cy="282" r="5" fill="#1baf7a"/>
  <text x="827" y="287" font-size="16" font-weight="700" fill="#0b0b0b">Correlation with PM2.5</text>

  <g font-size="13" fill="#0b0b0b">
    <text x="815" y="345">NO₂</text>
    <rect x="860" y="330" width="270" height="22" rx="4" fill="#184f95"/>
    <text x="1120" y="346" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">strongest</text>

    <text x="815" y="395">SO₂</text>
    <rect x="860" y="380" width="175" height="22" rx="4" fill="#2a78d6"/>

    <text x="815" y="445">O₃</text>
    <rect x="860" y="430" width="115" height="22" rx="4" fill="#5598e7"/>
  </g>
  <text x="813" y="500" font-size="11" fill="#898781">NO₂ showed the strongest link to PM2.5</text>
  <text x="813" y="520" font-size="11" fill="#898781">among tested secondary pollutants.</text>
  <text x="813" y="540" font-size="11" fill="#898781">Bar lengths illustrative / relative.</text>

  <!-- Model comparison (bar chart, RMSE lower = better) -->
  <rect x="30" y="580" width="1140" height="210" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <circle cx="48" cy="612" r="5" fill="#eda100"/>
  <text x="62" y="617" font-size="16" font-weight="700" fill="#0b0b0b">Model Comparison — RMSE (lower is better)</text>

  <line x1="90" y1="740" x2="1140" y2="740" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- bars: Linear Regression best (shortest) -->
  <rect x="140" y="660" width="110" height="80" rx="4" fill="#1baf7a"/>
  <text x="195" y="652" font-size="12" font-weight="700" fill="#1baf7a" text-anchor="middle">~13.5 ★</text>
  <text x="195" y="760" font-size="12" fill="#52514e" text-anchor="middle">Linear Reg.</text>

  <rect x="300" y="642" width="110" height="98" rx="4" fill="#5598e7"/>
  <text x="355" y="634" font-size="12" font-weight="600" fill="#52514e" text-anchor="middle">higher</text>
  <text x="355" y="760" font-size="12" fill="#52514e" text-anchor="middle">SARIMAX</text>

  <rect x="460" y="628" width="110" height="112" rx="4" fill="#86b6ef"/>
  <text x="515" y="760" font-size="12" fill="#52514e" text-anchor="middle">SARIMA</text>

  <rect x="620" y="620" width="110" height="120" rx="4" fill="#86b6ef"/>
  <text x="675" y="760" font-size="12" fill="#52514e" text-anchor="middle">ARIMA</text>

  <rect x="780" y="612" width="110" height="128" rx="4" fill="#256abf"/>
  <text x="835" y="760" font-size="12" fill="#52514e" text-anchor="middle">Random Forest</text>

  <rect x="940" y="600" width="110" height="140" rx="4" fill="#184f95"/>
  <text x="995" y="760" font-size="12" fill="#52514e" text-anchor="middle">Decision Tree</text>

  <text x="1140" y="620" font-size="11" fill="#898781" text-anchor="end">Relative error heights illustrative · Linear Regression selected as best</text>

  <!-- footer -->
  <text x="30" y="808" font-size="12" fill="#898781">Heta Chavda · Data Analytics Portfolio · github.com/hetachavda</text>
</svg>
